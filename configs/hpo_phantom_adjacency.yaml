# Search space for tuning with the default --adjacency-space phantom.
#
# The stock window ranges (min_window 1-5, max_expand 3-10) cannot express
# configs below ~1300 tokens on wiki_100_qa_hard, so every trial hit the
# 1200-token wall and HPO degenerated into "least over budget". Widened so
# the economical region found in ablation P.1 (e.g. min_window 1 +
# max_expand 1 at ~570 tokens) is reachable. Threshold ranges stay at the
# defaults: phantom-space adjacency sims are p1=0.647..p99=0.990, fully
# inside 0.5-0.99.
search_space:
  min_window: [0, 5]
  max_expand: [1, 10]
