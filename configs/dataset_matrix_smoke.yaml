name: dataset_matrix_smoke

benchmark:
  enabled: true
  top_k: 5
  metric_k: 5
  qa_delay: 1.1

datasets:
  - name: static
    source: static
  - name: custom_sample
    source: custom
    dataset_path: data/custom_benchmark.jsonl

embeddings:
  - provider: mock
    model: mock:384

strategy_sets:
  - strategies: [naive, token_text, dynamic_semantic]
