name: custom_optuna_example

prepare_corpus:
  enabled: true
  source: custom
  dataset_path: data/custom_benchmark.jsonl
  top_k: 100
  min_sentences: 1
  corpus_path: results/corpora/custom_example/cached_corpus.pkl
  articles_output_path: results/corpora/custom_example/articles.jsonl
  questions_output_path: results/corpora/custom_example/questions.jsonl
  embedding:
    provider: huggingface
    model: BAAI/bge-small-en-v1.5

optuna:
  enabled: true
  n_trials: 100
  corpus_path: results/corpora/custom_example/cached_corpus.pkl
  strategy: dynamic_semantic
  hpo_config: configs/hpo_dynamic_balanced.yaml
  target_clusters: 5
  soft_token_limit: 1200
  output_dir: results/optuna/custom_example
  best_params_json: results/optuna/custom_example/best_params.json
  apply_best_params: true
  no_viz: true

benchmark:
  enabled: true
  source: custom
  dataset_path: data/custom_benchmark.jsonl
  top_k: 5
  metric_k: 5

embeddings:
  - provider: huggingface
    model: BAAI/bge-small-en-v1.5

strategy_sets:
  - strategies: [naive, fixed_window, token_text, semantic_splitter, dynamic_semantic]
