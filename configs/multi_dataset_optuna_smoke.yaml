name: multi_dataset_optuna_smoke

embeddings:
  - provider: mock
    model: mock:64

strategy_sets:
  - strategies: [naive, token_text, dynamic_semantic]

pipelines:
  - name: custom_sample
    prepare_corpus:
      enabled: true
      source: custom
      dataset_path: data/custom_benchmark.jsonl
      top_k: 10
      min_sentences: 1
      corpus_path: results/corpora/multi_dataset_optuna/custom_sample/cached_corpus.pkl
      articles_output_path: results/corpora/multi_dataset_optuna/custom_sample/articles.jsonl
      questions_output_path: results/corpora/multi_dataset_optuna/custom_sample/questions.jsonl
      embedding:
        provider: mock
        model: mock:64
    optuna:
      enabled: true
      n_trials: 1
      study_name: multi_custom_sample
      corpus_path: results/corpora/multi_dataset_optuna/custom_sample/cached_corpus.pkl
      strategy: dynamic_semantic
      hpo_config: configs/hpo_dynamic_balanced.yaml
      target_clusters: 3
      soft_token_limit: 800
      output_dir: results/optuna/multi_dataset_optuna/custom_sample
      best_params_json: results/optuna/multi_dataset_optuna/custom_sample/best_params.json
      best_params_txt: results/optuna/multi_dataset_optuna/custom_sample/best_params.txt
      storage: sqlite:///results/optuna/multi_dataset_optuna/custom_sample/study.db
      apply_best_params: true
      no_viz: true
    benchmark:
      enabled: true
      source: custom
      dataset_path: data/custom_benchmark.jsonl
      dataset_name: custom_sample
      top_k: 3
      metric_k: 3

  - name: optimization_sample
    prepare_corpus:
      enabled: true
      source: custom
      dataset_path: data/custom_benchmark_alt.jsonl
      top_k: 10
      min_sentences: 1
      corpus_path: results/corpora/multi_dataset_optuna/optimization_sample/cached_corpus.pkl
      articles_output_path: results/corpora/multi_dataset_optuna/optimization_sample/articles.jsonl
      questions_output_path: results/corpora/multi_dataset_optuna/optimization_sample/questions.jsonl
      embedding:
        provider: mock
        model: mock:64
    optuna:
      enabled: true
      n_trials: 1
      study_name: multi_optimization_sample
      corpus_path: results/corpora/multi_dataset_optuna/optimization_sample/cached_corpus.pkl
      strategy: dynamic_semantic
      hpo_config: configs/hpo_dynamic_balanced.yaml
      target_clusters: 3
      soft_token_limit: 800
      output_dir: results/optuna/multi_dataset_optuna/optimization_sample
      best_params_json: results/optuna/multi_dataset_optuna/optimization_sample/best_params.json
      best_params_txt: results/optuna/multi_dataset_optuna/optimization_sample/best_params.txt
      storage: sqlite:///results/optuna/multi_dataset_optuna/optimization_sample/study.db
      apply_best_params: true
      no_viz: true
    benchmark:
      enabled: true
      source: custom
      dataset_path: data/custom_benchmark_alt.jsonl
      dataset_name: optimization_sample
      top_k: 3
      metric_k: 3
