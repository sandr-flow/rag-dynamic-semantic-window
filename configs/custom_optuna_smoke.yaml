name: custom_optuna_smoke

prepare_corpus:
  enabled: true
  source: custom
  dataset_path: data/custom_benchmark.jsonl
  top_k: 10
  min_sentences: 1
  corpus_path: results/corpora/custom_optuna_smoke/cached_corpus.pkl
  articles_output_path: results/corpora/custom_optuna_smoke/articles.jsonl
  questions_output_path: results/corpora/custom_optuna_smoke/questions.jsonl
  embedding:
    provider: mock
    model: mock:64

optuna:
  enabled: true
  n_trials: 2
  study_name: custom_optuna_smoke
  corpus_path: results/corpora/custom_optuna_smoke/cached_corpus.pkl
  strategy: dynamic_semantic
  hpo_config: configs/hpo_dynamic_balanced.yaml
  target_clusters: 3
  soft_token_limit: 800
  output_dir: results/optuna/custom_optuna_smoke
  best_params_json: results/optuna/custom_optuna_smoke/best_params.json
  best_params_txt: results/optuna/custom_optuna_smoke/best_params.txt
  storage: sqlite:///results/optuna/custom_optuna_smoke/study.db
  apply_best_params: true
  no_viz: true

benchmark:
  enabled: true
  source: custom
  dataset_path: data/custom_benchmark.jsonl
  top_k: 3
  metric_k: 3

embeddings:
  - provider: mock
    model: mock:64

strategy_sets:
  - strategies: [naive, token_text, dynamic_semantic]
